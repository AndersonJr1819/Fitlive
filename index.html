<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fit Live | Login</title>
        <link rel="shortcut icon" href="img/Logo.jpeg" type="image/x-icon">
        <link rel="stylesheet" href="styles/styles/style.css">
        <script src="js/script.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.css">
    </head>
    <body>
        <header>
            <nav>
                <a href="#">
                    <img src="img/Logo.jpeg" alt="Logo Fit Live">
                    <span>Fit Live</span>
                </a>
            </nav>
            <p>Alimentação saudável, prática e para todos.</p>
        </header>
        <main>
            <section>
                <h1>Bem-vindo(a)!</h1>
                <p>Faça login para continuar.</p>
                <form action="#" method="POST">
                    <fieldset>
                        <div>
                            <label for="email">E-mail</label>
                            <div>
                                <i data-lucide="mail" aria-hidden="true"></i>
                                <input type="email" id="email" name="email" autocomplete="email" required>
                            </div>
                        </div>
                        <div>
                            <label for="password">Senha</label>
                            <div>
                                <i data-lucide="lock" aria-hidden="true"></i>
                                <input type="password" id="password" name="password" autocomplete="current-password" required>
                                <button type="button" aria-label="Mostrar senha">
                                    <i data-lucide="eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label>
                                <input type="checkbox" name="remember"> Lembrar de mim
                            </label>
                            <a href="">Esqueci minha senha</a>
                        </div>
                        <button type="submit">Entrar</button>
                    </fieldset>
                </form>
                <div>
                    <p>Ainda não tem uma conta?</p>
                    <a href="">Cadastre-se</a>
                </div>
            </section>
        </main>
        <footer>
            <p>&copy; 2026 Fit Live</p>
        </footer>
    </body>
</html>
